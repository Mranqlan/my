<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | إدارة المخزون والأصناف</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>إدارة المخزون والأصناف (Inventory)</h2>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openItemModal()">+ إضافة صنف جديد</button>
                    <button class="btn btn-secondary" onclick="generateMissingBarcodes()" style="background-color: #f59e0b; color: white; margin-right: 10px;">🏷️ توليد باركود للأصناف القديمة</button>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th width="10%">كود الصنف</th>
                            <th width="20%">اسم الصنف</th>
                            <th width="15%">الباركود</th>
                            <th width="12%">متوسط التكلفة</th>
                            <th width="12%">سعر البيع</th>
                            <th width="10%">الكمية</th>
                            <th width="13%">المستودع</th>
                            <th width="8%">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="items-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- نافذة إضافة صنف -->
    <div class="modal-overlay" id="item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة صنف جديد</h3>
                <button class="close-btn" onclick="closeItemModal()">×</button>
            </div>
            <form id="add-item-form" onsubmit="saveItem(event)">
                <div class="modal-body">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>اسم الصنف</label>
                        <input type="text" id="item-name" required placeholder="مثال: شاشة Dell 24 بوصة">
                    </div>
                    <div class="form-row" style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label>سعر الشراء</label>
                            <input type="number" id="item-purchase" value="0.00" step="0.01" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>سعر البيع</label>
                            <input type="number" id="item-sale" value="0.00" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>الكمية الافتتاحية</label>
                        <input type="number" id="item-qty" value="0" step="1" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>الباركود (اتركه فارغاً للتوليد التلقائي)</label>
                        <input type="text" id="item-barcode" placeholder="مثال: 123456789012">
                    </div>
                    <div class="form-group">
                        <label>المستودع</label>
                        <select id="item-warehouse" required>
                            <!-- سيتم تعبئتها بالجافاسكريبت -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeItemModal()">إلغاء</button>
                    <button type="submit" class="btn btn-success">حفظ الصنف</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js?v=999000"></script>
    <script src="/assets/js/inventory.js?v=999000"></script>
    <!-- نافذة طباعة الباركود -->
    <div class="modal-overlay" id="barcode-modal">
        <div class="modal-content" style="width: 400px; text-align: center;">
            <div class="modal-header">
                <h3>طباعة الباركود</h3>
                <button class="close-btn" onclick="document.getElementById('barcode-modal').style.display='none'">×</button>
            </div>
            <div class="modal-body" style="padding: 30px;">
                <h4 id="barcode-item-name" style="margin-bottom: 20px; color: #0f172a;"></h4>
                <svg id="barcode-svg" style="width: 100%; height: 100px;"></svg>
                <div style="margin-top: 15px; font-family: monospace; font-size: 16px; font-weight: bold; color: #1e293b;" id="barcode-text"></div>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button>
                <button class="btn btn-secondary" onclick="document.getElementById('barcode-modal').style.display='none'">إغلاق</button>
            </div>
        </div>
    </div>
    <!-- ===== Core Scripts (Cleaned by System) ===== -->
    <!-- ===== Core Scripts (Cleaned by System) ===== -->

    <!-- ===== Core Scripts (Injected by Audit System) ===== -->
    <script src="/assets/js/database.js?v=999000"></script>
    <script src="/assets/js/layout.js?v=999000"></script>
    <script src="/assets/js/app.js?v=999000"></script>
    <script src="/assets/js/company-info.js?v=999000"></script>
    <script src="/assets/js/permissions.js?v=999000"></script>
    <script src="/assets/js/ai-assistant.js?v=999000"></script>
    <script src="/assets/js/global-search.js?v=999000"></script>
    <script src="/assets/js/export-dark.js?v=999000"></script>

</body>
</html>
