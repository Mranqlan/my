<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل فواتير المشتريات</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=555555">
    <link rel="stylesheet" href="/assets/css/components.css?v=555555">
    <style>
        @media print {
            .sidebar, .top-header, .page-header, .header-actions, .no-print { display: none !important; }
            body, .main-wrapper, .content-area { margin: 0 !important; padding: 0 !important; width: 100% !important; background: white !important; height: auto !important; overflow: visible !important; }
            .table-container { box-shadow: none !important; border: none !important; padding: 0 !important; }
            .data-table th, .data-table td { border: 1px solid #000 !important; padding: 10px !important; color: #000 !important; }
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header no-print">
            <div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div>
        </header>
        <section class="content-area no-print">
            <div class="page-header">
                <h2>سجل فواتير المشتريات</h2>
                <div class="header-actions">
                    <a href="purchase-invoices.html" class="btn btn-primary">+ فاتورة مشتريات جديدة</a>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>رقم الفاتورة</th>
                            <th>التاريخ</th>
                            <th>المورد</th>
                            <th>الإجمالي</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="purchases-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- نافذة المعاينة -->
    <div class="modal-overlay no-print" id="print-modal">
        <div class="modal-content" style="width: 800px; max-width: 95%;">
            <div class="modal-header">
                <h3>معاينة فاتورة المشتريات</h3>
                <button class="close-btn" onclick="document.getElementById('print-modal').style.display='none'">×</button>
            </div>
            <div class="modal-body" style="background: #f1f5f9; padding: 20px; max-height: 70vh; overflow-y: auto;">
                <div id="print-area" style="background: white; padding: 30px; border-radius: 8px;">
                    <div style="text-align: center; border-bottom: 2px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px;">
                        <h2 style="color: #1e293b; margin: 0;"><span class="dynamic-company-name">شركة AL SHAMEL للمحاسبة</span></h2>
                        <p style="color: #64748b; margin: 5px 0;">فاتورة مشتريات رسمية</p>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                        <div><strong>رقم الفاتورة:</strong> <span id="p-inv-num"></span></div>
                        <div><strong>التاريخ:</strong> <span id="p-inv-date"></span></div>
                    </div>
                    <div style="margin-bottom: 20px;"><strong>المورد:</strong> <span id="p-inv-supplier"></span></div>
                    
                    <table class="data-table">
                        <thead>
                            <tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>
                        </thead>
                        <tbody id="p-inv-items"></tbody>
                    </table>

                    <div style="margin-top: 20px; text-align: left; font-size: 16px;">
                        <div style="margin-bottom: 5px;"><strong>الإجمالي (بدون ضريبة):</strong> <span id="p-inv-subtotal"></span></div>
                        <div style="margin-bottom: 5px;"><strong>الضريبة (15%):</strong> <span id="p-inv-vat"></span></div>
                        <div style="font-size: 18px; font-weight: bold; color: #1e293b;"><strong>الإجمالي النهائي:</strong> <span id="p-inv-total"></span></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="document.getElementById('print-modal').style.display='none'">إغلاق</button>
                <button class="btn btn-success" onclick="window.print()">🖨️ طباعة الفاتورة</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/database.js?v=777777"></script>
    <script src="/assets/js/layout.js?v=777777"></script>
    <script src="/assets/js/app.js?v=777777"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPurchases();
        });

        // دالة عرض المشتريات (تعمل فورا من الذاكرة المحلية)
        function renderPurchases() {
            const tbody = document.getElementById('purchases-body');
            if(!tbody) return;
            
            const purchases = getPurchases(); // جلب من الذاكرة
            tbody.innerHTML = '';
            
            if(purchases.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#64748b;">لا توجد فواتير مشتريات مسجلة.</td></tr>';
                return;
            }
            
            // عرض الفواتير من الأحدث للأقدم
            purchases.slice().reverse().forEach(inv => {
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold; color:var(--primary-color);">${inv.invoiceNumber}</td>
                        <td>${inv.date}</td>
                        <td style="text-align:right;">${inv.supplierName}</td>
                        <td class="text-debit" style="font-family:monospace; font-weight:bold;">${parseFloat(inv.total).toFixed(2)}</td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 5px 10px; font-size: 12px;" onclick="printPurchase(${inv.id})">🖨️ طباعة</button>
                        </td>
                    </tr>`;
            });
        }

        function printPurchase(id) {
            const invoice = getPurchases().find(i => i.id === id);
            if(!invoice) return alert('الفاتورة غير موجودة');

            document.getElementById('p-inv-num').textContent = invoice.invoiceNumber;
            document.getElementById('p-inv-date').textContent = invoice.date;
            document.getElementById('p-inv-supplier').textContent = invoice.supplierName;
            
            const itemsBody = document.getElementById('p-inv-items');
            itemsBody.innerHTML = '';
            let subtotal = 0;
            
            if (invoice.items && invoice.items.length > 0) {
                invoice.items.forEach(item => {
                    const itemTotal = item.qty * item.price;
                    subtotal += itemTotal;
                    itemsBody.innerHTML += `<tr><td>${item.itemName}</td><td>${item.qty}</td><td>${parseFloat(item.price).toFixed(2)}</td><td>${itemTotal.toFixed(2)}</td></tr>`;
                });
            } else {
                itemsBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">لا توجد تفاصيل للأصناف (فاتورة قديمة)</td></tr>';
                subtotal = invoice.total / 1.15;
            }

            const vat = invoice.total - subtotal;
            document.getElementById('p-inv-subtotal').textContent = subtotal.toFixed(2);
            document.getElementById('p-inv-vat').textContent = vat.toFixed(2);
            document.getElementById('p-inv-total').textContent = invoice.total.toFixed(2);

            document.getElementById('print-modal').style.display = 'flex';
        }
    </script>
    <script src="/assets/js/company-info.js?v=777777"></script>
    <script src="/assets/js/permissions.js?v=777777"></script>
</body>
</html>
