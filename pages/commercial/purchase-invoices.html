<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | إنشاء فاتورة مشتريات</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <style>
        /* استخدام Grid لضمان بقاء الأعمدة الأربعة بجانب بعضها */
        .top-row-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr 1fr !important;
            gap: 15px !important;
            margin-bottom: 25px !important;
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>إنشاء فاتورة مشتريات (Purchase Invoice)</h2>
            </div>
            <div class="entry-form-container">
                <div class="top-row-grid">
                    <div class="form-group">
                        <label>المورد</label>
                        <select id="purchase-supplier" required>
                            <option value="">-- اختر المورد --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>تاريخ الفاتورة</label>
                        <input type="date" id="purchase-date">
                    </div>
                    <div class="form-group">
                        <label>الفرع / القسم</label>
                        <select id="purchase-branch" required>
                            <option value="">-- اختر الفرع --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المستودع</label>
                        <select id="purchase-warehouse" required>
                            <option value="">-- اختر المستودع --</option>
                        </select>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="data-table" id="purchase-items-table">
                        <thead>
                            <tr>
                                <th width="50%">الصنف</th>
                                <th width="20%">الكمية</th>
                                <th width="20%">سعر الشراء</th>
                                <th width="10%">إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="purchase-items-body"></tbody>
                    </table>
                </div>
                <div class="entry-footer">
                    <button class="btn btn-accent" onclick="addRow()">+ إضافة صنف للفاتورة</button>
                    <div class="totals-section" style="flex-direction: column; gap: 10px; background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 15px;">
                        <div style="display: flex; justify-content: space-between; width: 100%;">
                            <span>إجمالي الشراء (بدون ضريبة):</span>
                            <strong id="subtotal" style="font-family: monospace;">0.00</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                            <span>الضريبة (15%): <input type="text" id="vat-rate" value="15" oninput="calcTotal()" style="width: 60px; padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1; text-align: center;"> %</span>
                            <strong id="vat-amount" style="font-family: monospace;">0.00</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; width: 100%; border-top: 2px solid #cbd5e1; padding-top: 10px; margin-top: 5px;">
                            <span style="font-weight: bold; color: var(--primary-color);">الإجمالي النهائي:</span>
                            <strong id="purchase-total" style="font-size: 22px; color: var(--primary-color); font-family: monospace;">0.00</strong>
                        </div>
                    </div>
                    <button class="btn btn-success" style="margin-top: 15px; font-size: 18px; padding: 15px;" onclick="saveInvoice()">حفظ الفاتورة وتوليد القيد</button>
                </div>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('purchase-date').valueAsDate = new Date();
            const urlParams = new URLSearchParams(window.location.search);
            const poId = urlParams.get('po_id');
            if (poId) {
                const po = getPurchaseOrders().find(p => p.id == poId);
                if (po) {
                    document.getElementById('purchase-supplier').value = po.supplierId;
                    document.getElementById('purchase-date').value = po.date;
                    if (po.branchId) {
                        document.getElementById('purchase-branch').value = po.branchId;
                    }
                    const tbody = document.getElementById('purchase-items-body');
                    tbody.innerHTML = '';
                    po.items.forEach(item => {
                        const tr = document.createElement('tr');
                        let options = '<option value="">-- اختر الصنف --</option>';
                        getItems().forEach(i => { options += `<option value="${i.id}" data-cost="${i.purchasePrice}" data-name="${i.name}">${i.code} - ${i.name}</option>`; });
                        tr.innerHTML = `
                            <td><select class="item-select" onchange="updateRow(this)" style="width:100%; padding:8px;">${options}</select></td>
                            <td><input type="text" class="item-qty" value="${item.qty}" onchange="calcTotal()" onfocus="this.select()" style="width:100%; text-align:center;"></td>
                            <td><input type="text" class="item-price" value="${item.price}" onchange="calcTotal()" onfocus="this.select()" style="width:100%; text-align:center;"></td>
                            <td><button class="btn-delete" onclick="this.parentElement.parentElement.remove(); calcTotal();">حذف</button></td>
                        `;
                        tbody.appendChild(tr);
                        tr.querySelector('.item-select').value = item.itemId;
                    });
                    calcTotal();
                    const hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.id = 'source-po-id';
                    hiddenInput.value = poId;
                    document.querySelector('.entry-form-container').appendChild(hiddenInput);
                }
            }
            // تأخير بسيط لضمان تحميل الدوال من قاعدة البيانات
            setTimeout(() => {
                try {
                    const supplierSelect = document.getElementById('purchase-supplier');
                    if(typeof getSuppliers === 'function') {
                        getSuppliers().forEach(sup => { supplierSelect.innerHTML += `<option value="${sup.id}" data-name="${sup.name}">${sup.code} - ${sup.name}</option>`; });
                    }
                    const branchSelect = document.getElementById('purchase-branch');
                    if(typeof getCostCenters === 'function') {
                        getCostCenters().forEach(c => { branchSelect.innerHTML += `<option value="${c.id}" data-name="${c.name}">${c.type === 'فرع' ? '🏢' : '↳'} ${c.name}</option>`; });
                    }
                    const whSelect = document.getElementById('purchase-warehouse');
                    if(typeof getWarehouses === 'function') {
                        getWarehouses().forEach(wh => { whSelect.innerHTML += `<option value="${wh.id}" data-name="${wh.name}">${wh.name}</option>`; });
                    }
                } catch(e) { console.error('خطأ في تحميل البيانات', e); }
            }, 100); // انتظار 100 جزء من الثانية
            addRow();
        });
        function addRow() {
            const tbody = document.getElementById('purchase-items-body');
            const tr = document.createElement('tr');
            let options = '<option value="">-- اختر الصنف --</option>';
            if(typeof getItems === 'function') {
                getItems().forEach(item => { options += `<option value="${item.id}" data-cost="${item.purchasePrice}" data-name="${item.name}">${item.code} - ${item.name}</option>`; });
            }
            tr.innerHTML = `
                <td><select class="item-select" onchange="updateRow(this)" style="width:100%; padding:8px;">${options}</select></td>
                <td><input type="text" class="item-qty" value="1" onchange="calcTotal()" onfocus="this.select()" style="width:100%; text-align:center;"></td>
                <td><input type="text" class="item-price" onchange="calcTotal()" onfocus="this.select()" style="width:100%; text-align:center;"></td>
                <td><button class="btn-delete" onclick="this.parentElement.parentElement.remove(); calcTotal();">حذف</button></td>
            `;
            tbody.appendChild(tr);
        }
        function updateRow(select) {
            const row = select.parentElement.parentElement;
            if(select.value) row.querySelector('.item-price').value = select.options[select.selectedIndex].getAttribute('data-cost');
            calcTotal();
        }
        function calcTotal() {
            let sub = 0;
            document.querySelectorAll('#purchase-items-body tr').forEach(row => {
                sub += ((parseFloat(row.querySelector('.item-qty').value)||0) * (parseFloat(row.querySelector('.item-price').value)||0));
            });
            const vatRate = parseFloat(document.getElementById('vat-rate').value) || 0;
            const vatAmt = sub * (vatRate / 100);
            document.getElementById('subtotal').textContent = sub.toFixed(2);
            document.getElementById('vat-amount').textContent = vatAmt.toFixed(2);
            document.getElementById('purchase-total').textContent = (sub + vatAmt).toFixed(2);
            return { sub, vatAmt, grand: sub + vatAmt };
        }
        function saveInvoice() {
            const t = calcTotal();
            if (t.grand <= 0) return alert('أدخل أصنافاً صحيحة.');
            const supId = document.getElementById('purchase-supplier').value;
            if(!supId) return alert('يرجى اختيار المورد أولاً.');
            const supName = document.getElementById('purchase-supplier').options[document.getElementById('purchase-supplier').selectedIndex]?.getAttribute('data-name');
            const branchName = document.getElementById('purchase-branch').options[document.getElementById('purchase-branch').selectedIndex]?.getAttribute('data-name') || '';
            const whSelect = document.getElementById('purchase-warehouse');
            const whId = parseInt(whSelect.value);
            const whName = whSelect.options[whSelect.selectedIndex]?.getAttribute('data-name') || '';
            const date = document.getElementById('purchase-date').value;
            let itemsDet = [];
            let allItems = getItems();
            document.querySelectorAll('#purchase-items-body tr').forEach(row => {
                const sel = row.querySelector('.item-select');
                if(!sel.value) return;
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const cost = parseFloat(row.querySelector('.item-price').value) || 0;
                const itemId = parseInt(sel.value);
                itemsDet.push({ itemId, itemName: sel.options[sel.selectedIndex].getAttribute('data-name'), qty, price: cost });
                let idx = allItems.findIndex(i => i.id === itemId && i.warehouseId === whId);
                if (idx !== -1) {
                    let item = allItems[idx];
                    let oldQty = parseFloat(item.qty) || 0;
                    let oldCost = parseFloat(item.purchasePrice) || 0;
                    let totalQty = oldQty + qty;
                    if (totalQty > 0) {
                        item.purchasePrice = ((oldQty * oldCost) + (qty * cost)) / totalQty;
                    }
                    item.qty = totalQty;
                } else {
                    let baseItem = allItems.find(i => i.id === itemId);
                    if (baseItem) {
                        allItems.push({ ...baseItem, id: Date.now() + Math.random(), qty: qty, purchasePrice: cost, warehouseId: whId, warehouseName: whName });
                    }
                }
            });
            saveItems(allItems);
            const purchases = getPurchases();
            const invNum = `PUR-${new Date().getFullYear()}-${String(purchases.length + 1).padStart(4, '0')}`;
            purchases.push({ id: Date.now(), invoiceNumber: invNum, supplierId: parseInt(supId), supplierName: supName, date, total: t.grand, items: itemsDet, warehouse: whName });
            savePurchases(purchases);
            updateSupplierBalance(parseInt(supId), t.grand);
            const entries = getEntries();
            entries.push({ 
                id: Date.now(), 
                entryNumber: `JV-${new Date().getFullYear()}-${String(entries.length+1).padStart(4,'0')}`, 
                date: date, 
                description: `فاتورة مشتريات ${invNum} - ${branchName} - (${whName})`, 
                lines: [
                    { accountCode: "1104", accountName: "المخزون", debit: t.sub, credit: 0 },
                    { accountCode: "1105", accountName: "ضريبة المدخلات", debit: t.vatAmt, credit: 0 },
                    { accountCode: "2101", accountName: "الموردون", debit: 0, credit: t.grand }
                ], 
                totalDebit: t.grand, 
                totalCredit: t.grand 
            });
            saveEntries(entries);
            const sourcePoId = document.getElementById('source-po-id')?.value;
            if (sourcePoId) {
                let pos = getPurchaseOrders();
                let poIndex = pos.findIndex(p => p.id == sourcePoId);
                if (poIndex !== -1) {
                    pos[poIndex].status = 'converted';
                    savePurchaseOrders(pos);
                }
            }
            alert(`تم حفظ فاتورة المشتريات ${invNum} بنجاح!`);
            window.location.href = 'suppliers.html';
        }
    </script>
