<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | مرتجعات المشتريات</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>مرتجعات المشتريات (Purchase Returns)</h2>
            </div>
            <div class="entry-form-container">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>اختر فاتورة المشتريات الأصلية</label>
                    <select id="return-invoice" onchange="loadInvoiceItems()">
                        <option value="">-- اختر الفاتورة --</option>
                    </select>
                </div>
                <div class="table-responsive" style="display: none;" id="return-items-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th width="40%">الصنف</th>
                                <th width="20%">الكمية المشتراة</th>
                                <th width="20%">الكمية المرتجعة</th>
                                <th width="20%">سعر الشراء</th>
                            </tr>
                        </thead>
                        <tbody id="return-items-body"></tbody>
                    </table>
                </div>
                <div class="entry-footer" id="return-footer" style="display: none; border:none; padding-top:20px;">
                    <div class="totals-section" style="justify-content: space-between; background: #e2e8f0;">
                        <div class="total-box">
                            <span>قيمة المرتجع:</span>
                            <strong id="return-total" style="font-size: 20px; color: #ef4444;">0.00</strong>
                        </div>
                    </div>
                    <button class="btn btn-success" style="margin-top: 15px; font-size: 18px; padding: 15px; background-color:#ef4444;" onclick="savePurchaseReturn()">
                        حفظ المرتجع وتوليد القيود المحاسبية
                    </button>
                </div>
            </div>
        </section>
    </main>
<script src="/assets/js/purchase-returns.js?v=999998"></script>

</body>
</html>
