<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | كشف حساب تفصيلي</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile">
                <span>OMRAN AQLAN</span>
                <div class="avatar"></div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="بحث في النظام المحاسبي...">
            </div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>كشف حساب تفصيلي (Account Statement)</h2>
            </div>
            <div class="filter-container">
                <div class="form-group">
                    <label>اختر الحساب</label>
                    <select id="account-selector" onchange="generateStatement()">
                        <!-- سيتم تعبئتها بالجافاسكريبت -->
                    </select>
                </div>
            </div>
            <div class="table-container">
                <div id="statement-header" style="padding: 15px; background: #e2e8f0; display: none; border-radius: 8px 8px 0 0;">
                    <h3 style="color: var(--primary-color); margin: 0;">كشف حساب: <span id="statement-account-name"></span></h3>
                </div>
                <table class="data-table trial-balance-table" id="statement-table">
                    <thead>
                        <tr>
                            <th width="15%">التاريخ</th>
                            <th width="15%">رقم القيد</th>
                            <th width="30%">البيان (الشرح)</th>
                            <th width="15%">مدين</th>
                            <th width="15%">دائن</th>
                            <th width="15%">الرصيد</th>
                        </tr>
                    </thead>
                    <tbody id="statement-body">
                        <tr><td colspan="6" style="text-align: center; color: #64748b; padding: 30px;">يرجى اختيار حساب من القائمة أعلاه لعرض الحركات.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/assets/js/account-statement.js?v=555111"></script>
    <!-- ===== Core Scripts (Cleaned by System) ===== -->
    <!-- ===== Core Scripts (Cleaned by System) ===== -->

    <!-- ===== Core Scripts (Injected by Audit System) ===== -->

    <script src="/assets/js/layout.js?v=555111"></script>
    <script src="/assets/js/app.js?v=555111"></script>
    <script src="/assets/js/company-info.js?v=555111"></script>
    <script src="/assets/js/permissions.js?v=555111"></script>
    <script src="/assets/js/ai-assistant.js?v=555111"></script>
    <script src="/assets/js/global-search.js?v=555111"></script>
    <script src="/assets/js/export-dark.js?v=555111"></script>

</body>
</html>
