<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | الإقرار الضريبي</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <style>
        @media print {
            .sidebar, .top-header, .page-header .btn, .filter-bar { display: none !important; }
            .main-wrapper { margin: 0; padding: 0; }
            .content-area { padding: 0; }
            .report-container { box-shadow: none; border: none; }
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div>
            <div class="search-box"><input type="text" placeholder="بحث..."></div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>الإقرار الضريبي (VAT Return)</h2>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="window.print()">🖨️ طباعة</button>
                </div>
            </div>
            <!-- فلتر التاريخ -->
            <div class="filter-bar" style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; border: 1px solid var(--border-color);">
                <label style="font-weight: 700;">من تاريخ:</label>
                <input type="date" id="start-date" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                <label style="font-weight: 700;">إلى تاريخ:</label>
                <input type="date" id="end-date" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                <button class="btn btn-primary" onclick="calculateVAT()">تصفية البيانات</button>
            </div>
            <div class="report-container">
                <div class="report-header">
                    <h1><span class="dynamic-company-name">شركة تعز سوفت للمحاسبة</span></h1>
                    <h3>إقرار ضريبة القيمة المضافة</h3>
                    <p style="margin-top: 10px; font-weight: 700; color: #64748b;">للفترة: <span id="report-period">من البداية إلى اليوم</span></p>
                </div>
                <table class="report-table" style="margin-top: 20px;">
                    <thead>
                        <tr style="background-color: #f8fafc;">
                            <th style="padding: 15px; text-align: right; border-bottom: 2px solid var(--border-color);">البيان</th>
                            <th style="padding: 15px; text-align: left; border-bottom: 2px solid var(--border-color);">المبلغ (ريال)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="padding: 15px; font-weight: 700;">إجمالي ضريبة المخرجات (المبيعات)</td>
                            <td style="padding: 15px; text-align: left; font-family: monospace; font-size: 16px; font-weight: 700;" id="output-vat">0.00</td>
                        </tr>
                        <tr>
                            <td style="padding: 15px; font-weight: 700;">إجمالي ضريبة المدخلات (المشتريات)</td>
                            <td style="padding: 15px; text-align: left; font-family: monospace; font-size: 16px; font-weight: 700;" id="input-vat">0.00</td>
                        </tr>
                        <tr style="background-color: #f8fafc; border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color);">
                            <td style="padding: 20px; font-weight: 800; font-size: 18px; color: var(--primary-color);">صافي الضريبة المستحقة (للهيئة)</td>
                            <td style="padding: 20px; text-align: left; font-family: monospace; font-size: 20px; font-weight: 800;" id="net-vat">0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            calculateVAT();
        });
        function calculateVAT() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            if (start && end) {
                document.getElementById('report-period').textContent = `من ${start} إلى ${end}`;
            } else if (start) {
                document.getElementById('report-period').textContent = `من ${start} حتى اليوم`;
            } else {
                document.getElementById('report-period').textContent = 'من البداية إلى اليوم';
            }
            let entries = getEntries();
            // تصفية حسب التاريخ إذا تم اختياره
            if (start) entries = entries.filter(e => e.date >= start);
            if (end) entries = entries.filter(e => e.date <= end);
            let outputVAT = 0;
            let inputVAT = 0;
            entries.forEach(entry => {
                entry.lines.forEach(line => {
                    // ضريبة المخرجات (2102) - طبيعتها دائنة
                    if (line.accountCode === "2102") {
                        outputVAT += (line.credit - line.debit);
                    }
                    // ضريبة المدخلات (1105) - طبيعتها مدينة
                    if (line.accountCode === "1105") {
                        inputVAT += (line.debit - line.credit);
                    }
                });
            });
            // إذا كانت المخرجات أقل من المدخلات (يعني استرداد ضريبي)
            const netVAT = outputVAT - inputVAT;
            document.getElementById('output-vat').textContent = outputVAT.toFixed(2);
            document.getElementById('input-vat').textContent = inputVAT.toFixed(2);
            const netEl = document.getElementById('net-vat');
            netEl.textContent = Math.abs(netVAT).toFixed(2);
            if (netVAT > 0) {
                netEl.style.color = '#ef4444'; // مبلغ مستحق (أحمر)
                netEl.textContent += ' (مستحق للهيئة)';
            } else if (netVAT < 0) {
                netEl.style.color = '#10b981'; // مبلغ مسترد (أخضر)
                netEl.textContent += ' (مسترد لك)';
            } else {
                netEl.style.color = '#64748b';
            }
        }
    </script>

</body>
</html>
