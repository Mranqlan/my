<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | إدارة الموردين</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile">
                <span>OMRAN AQLAN</span>
                <div class="avatar"></div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="بحث في النظام المحاسبي...">
            </div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>إدارة الموردين (Suppliers)</h2>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openSupplierModal()">+ إضافة مورد جديد</button>
                    <button class="btn btn-secondary" onclick="injectTestSuppliers()" style="margin-right: 10px;">إضافة موردين تجريبيين (للتجربة)</button>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th width="10%">كود المورد</th>
                            <th width="30%">اسم المورد</th>
                            <th width="20%">رقم الهاتف</th>
                            <th width="20%">الرصيد الحالي (دائن)</th>
                            <th width="20%">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="suppliers-body">
                        <!-- سيتم تعبئتها بالجافاسكريبت -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- نافذة إضافة مورد -->
    <div class="modal-overlay" id="supplier-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة مورد جديد</h3>
                <button class="close-btn" onclick="closeSupplierModal()">×</button>
            </div>
            <form id="add-supplier-form" onsubmit="saveSupplier(event)">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>اسم المورد</label>
                            <input type="text" id="sup-name" required placeholder="مثال: مؤسسة التقنية">
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف</label>
                            <input type="text" id="sup-phone" placeholder="مثال: 0500000000">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>الرصيد الافتتاحي (دائن)</label>
                            <input type="number" id="sup-balance" value="0.00" step="0.01">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeSupplierModal()">إلغاء</button>
                    <button type="submit" class="btn btn-success">حفظ المورد</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/assets/js/suppliers.js?v=333444"></script>
    <!-- ===== Core Scripts (Cleaned by System) ===== -->
    <!-- ===== Core Scripts (Cleaned by System) ===== -->

    <!-- ===== Core Scripts (Injected by Audit System) ===== -->
    <script src="/assets/js/database.js?v=333444"></script>
    <script src="/assets/js/layout.js?v=333444"></script>
    <script src="/assets/js/app.js?v=333444"></script>
    <script src="/assets/js/company-info.js?v=333444"></script>
    <script src="/assets/js/permissions.js?v=333444"></script>
    <script src="/assets/js/ai-assistant.js?v=333444"></script>
    <script src="/assets/js/global-search.js?v=333444"></script>
    <script src="/assets/js/export-dark.js?v=333444"></script>

</body>
</html>
