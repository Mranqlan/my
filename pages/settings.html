<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | الإعدادات العامة</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div>
            <div class="search-box"><input type="text" placeholder="بحث..."></div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>الإعدادات العامة (هوية الشركة)</h2>
            </div>
            <div class="entry-form-container" style="max-width: 800px; margin: 0 auto;">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>اسم الشركة (يظهر في التقارير والفواتير)</label>
                    <input type="text" id="set-company-name" placeholder="مثال: شركة النور للتجارة" style="font-size: 16px; font-weight: bold;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>الوصف / الشعار النصي</label>
                    <input type="text" id="set-tagline" placeholder="مثال: للأنظمة المحاسبية المتكاملة">
                </div>
                <div class="row" style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label>العملة الافتراضية</label>
                        <select id="set-currency">
                            <option value="ريال">ريال سعودي / يمني</option>
                            <option value="دولار">دولار أمريكي</option>
                            <option value="درهم">درهم إماراتي</option>
                            <option value="جنيه">جنيه مصري</option>
                            <option value="دينار">دينار</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>حرف الشعار (داخل المربع الأخضر)</label>
                        <input type="text" id="set-logo-text" maxlength="2" placeholder="O">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 20px; background: #fef3c7; padding: 15px; border-radius: 8px; border: 1px solid #fde68a;">
                    <label style="color: #92400e; font-weight: bold;">🔒 تاريخ إغلاق الفترات (لا يمكن إضافة أو تعديل قيود قبل هذا التاريخ)</label>
                    <input type="date" id="set-lock-date" style="margin-top: 10px; border-color: #fcd34d;">
                </div>
                <button class="btn btn-success" style="width: 100%; padding: 15px; font-size: 18px; margin-top: 20px;" onclick="saveCompanySettings()">
                    💾 حفظ الإعدادات
                </button>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const settings = getSettings();
            document.getElementById('set-company-name').value = settings.companyName;
            document.getElementById('set-tagline').value = settings.companyTagline;
            document.getElementById('set-currency').value = settings.currency;
            document.getElementById('set-logo-text').value = settings.logoText;
            if(settings.lockDate) document.getElementById('set-lock-date').value = settings.lockDate;
        });
        function saveCompanySettings() {
            const settings = {
                companyName: document.getElementById('set-company-name').value.trim(),
                companyTagline: document.getElementById('set-tagline').value.trim(),
                currency: document.getElementById('set-currency').value,
                logoText: document.getElementById('set-logo-text').value.trim() || "O",
                lockDate: document.getElementById('set-lock-date').value
            };
            saveSettings(settings);
            alert('تم حفظ الإعدادات بنجاح! سيتم تحديث التقارير والفواتير تلقائيا.');
            window.location.reload();
        }
    </script>
    <!-- ===== Core Scripts (Cleaned by System) ===== -->
    <!-- ===== Core Scripts (Cleaned by System) ===== -->

    <!-- ===== Core Scripts (Injected by Audit System) ===== -->

    <script src="/assets/js/layout.js?v=999998"></script>
    <script src="/assets/js/app.js?v=999998"></script>
    <script src="/assets/js/company-info.js?v=999998"></script>
    <script src="/assets/js/permissions.js?v=999998"></script>
    <script src="/assets/js/ai-assistant.js?v=999998"></script>
    <script src="/assets/js/global-search.js?v=999998"></script>
    <script src="/assets/js/export-dark.js?v=999998"></script>

</body>
</html>
