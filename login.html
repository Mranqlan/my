<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | Taiz Soft ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #10b981;
            --accent-glow: #34d399;
            --bg-glass: rgba(15, 23, 42, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Kufi Arabic', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة (نجوم وهالات ضوئية) */
        .glow-orb {
            position: absolute; border-radius: 50%; filter: blur(80px); z-index: 1; opacity: 0.6;
            animation: float 8s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: #10b981; top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #3b82f6; bottom: -50px; left: -50px; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(40px) scale(1.1); }
        }

        /* بطاقة الدخول الزجاجية */
        .login-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%; max-width: 450px;
            text-align: center;
            position: relative; z-index: 10;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* الشعار الأسطوري (SVG) */
        .logo-container {
            width: 110px; height: 110px; margin: 0 auto 20px;
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        
        .logo-svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.6));
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4)); transform: scale(0.98); }
            100% { filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.8)); transform: scale(1.02); }
        }

        .login-card h1 { color: #ffffff; font-size: 32px; font-weight: 900; letter-spacing: 1px; margin-bottom: 5px; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 40px; font-weight: 600; letter-spacing: 0.5px; }

        .form-group { text-align: right; margin-bottom: 25px; position: relative; }
        .form-group label { display: block; color: #cbd5e1; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #64748b; }

        .form-control {
            width: 100%; padding: 15px;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #ffffff; font-size: 15px; font-weight: 600;
            outline: none; transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent); background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .form-control::placeholder { color: #475569; }
        select.form-control { appearance: none; cursor: pointer; }
        select.form-control option { background: #0f172a; color: white; }

        .btn-login {
            width: 100%; padding: 16px; margin-top: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; border-radius: 12px;
            font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s; position: relative; overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-3px); box-shadow: 0 15px 35px rgba(16, 185, 129, 0.6);
        }
        .btn-login::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s;
        }
        .btn-login:hover::before { left: 100%; }

        .error-msg { color: #ef4444; font-size: 13px; font-weight: bold; margin-top: 15px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; border: 1px solid #ef4444; }
        
        .footer-text { margin-top: 30px; color: #475569; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <!-- الهالات الضوئية المتحركة -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="login-card">
        <!-- الشعار الأسطوري (هندسي متوهج) -->
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <!-- الشكل السداسي الخارجي -->
                <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linejoin="round"/>
                <!-- الحرف T و S المتداخلين -->
                <path d="M30 30 L70 30 M50 30 L50 80" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
                <path d="M75 45 C75 35, 65 35, 60 40 C55 45, 65 55, 60 60 C55 65, 45 60, 45 55" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
                <!-- نقطة مضيئة -->
                <circle cx="50" cy="85" r="4" fill="#34d399" />
            </svg>
        </div>

        <h1>تعز سوفت</h1>
        <p>TAIZ SOFT | Enterprise ERP</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group" style="margin-bottom: 20px;">
                <div class="input-wrapper">
                    <select id="login-user" class="form-control" style="padding: 18px 15px; text-align: center; font-size: 16px; font-weight: bold;" required>
                    </select>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 30px;">
                <div class="input-wrapper">
                    <input type="password" id="login-pass" class="form-control" placeholder="أدخل كلمة المرور..." style="padding: 18px 15px; text-align: center; font-size: 18px; letter-spacing: 2px;" required>
                </div>
            </div>

            <button type="submit" class="btn-login">دخول إلى النظام 🚀</button>
            <div id="error-message" class="error-msg"></div>
        </form>

        <div class="footer-text">
            © 2026 Taiz Soft. جميع الحقوق محفوظة.
        </div>
    </div>

    <script src="/assets/js/database.js?v=111112"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('onyx_current_user');
            const select = document.getElementById('login-user');
            try {
                const users = getUsers();
                if (users && users.length > 0) {
                    select.innerHTML = '';
                    users.forEach(u => {
                        select.innerHTML += `<option value="${u.username}">${u.fullName} (${u.role})</option>`;
                    });
                } else {
                    select.innerHTML = `<option value="admin">المدير العام (admin)</option>`;
                }
            } catch(e) {
                select.innerHTML = `<option value="admin">المدير العام (admin)</option>`;
            }
        });

        
        
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const user = getUsers().find(u => u.username === username);
                // التحقق من كلمة المرور (مع دعم admin / 123456 كاحتياط)
                if ((user && user.password === pass) || (username === 'admin' && pass === '123456')) {
                    if (!user) {
                        // إذا كان admin الافتراضي
                        localStorage.setItem('onyx_current_user', JSON.stringify({ id: 1, username: "admin", fullName: "OMRAN AQLAN", role: "admin" }));
                    } else {
                        localStorage.setItem('onyx_current_user', JSON.stringify(user));
                    }
                    // إزالة أي تفعيل سابق، وإجباره على شاشة التفعيل
                    localStorage.removeItem('onyx_license_valid');
                    window.location.href = '/pages/activate.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = 'كلمة المرور أو اسم المستخدم غير صحيح!';
                }
            } catch(err) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'حدث خطأ. يرجى المحاولة مرة أخرى.';
            }
        }
    
    
    </script>
</body>
</html>
