<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>تعز سوفت | الإشعارات الدائنة</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <style>
        .cn-hero { background: linear-gradient(135deg, #0f172a, #0d9488, #14b8a6); color: white; padding: 25px; border-radius: 16px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .cn-hero h2 { margin: 0; font-size: 24px; font-weight: 800; }
        .cn-table { background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow: hidden; }
        .cn-table table { width: 100%; border-collapse: collapse; }
        .cn-table th { background: #f8fafc; padding: 15px; font-size: 12px; font-weight: 800; color: #475569; text-align: right; }
        .cn-table td { padding: 14px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #f1f5f9; text-align: right; }
        .add-btn { background: linear-gradient(135deg, #14b8a6, #0d9488); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 800; cursor: pointer; font-family: inherit; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header"><div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div></header>
        <section class="content-area">
            <div class="cn-hero">
                <div><h2>📄 الإشعارات الدائنة (Credit Notes)</h2><p style="margin:5px 0 0 0; opacity:0.9;">تخفيض مديونية العميل</p></div>
            </div>
            <div style="margin-bottom:20px; text-align:left;"><button class="add-btn" onclick="openCNModal()">+ إشعار دائن جديد</button></div>
            <div class="cn-table">
                <table>
                    <thead><tr><th>رقم الإشعار</th><th>التاريخ</th><th>العميل</th><th>الفاتورة الأصلية</th><th>المبلغ (شامل الضريبة)</th><th>السبب</th></tr></thead>
                    <tbody id="cn-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <div class="modal-overlay" id="cn-modal">
        <div class="modal-content" style="width: 600px;">
            <div class="modal-header"><h3>إصدار إشعار دائن للعميل</h3><button class="close-btn" onclick="document.getElementById('cn-modal').style.display='none'">×</button></div>
            <form onsubmit="saveCN(event)">
                <div class="modal-body">
                    <div class="form-group" style="margin-bottom:15px;"><label>اختر الفاتورة الأصلية</label><select id="cn-invoice" required><option value="">-- اختر الفاتورة --</option></select></div>
                    <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:15px;">
                        <div class="form-group"><label>قيمة الإشعار (بدون ضريبة)</label><input type="text" inputmode="decimal" id="cn-amount" value="0.00" oninput="calcCNTotal()" required></div>
                        <div class="form-group"><label>التاريخ</label><input type="date" id="cn-date" required></div>
                    </div>
                    <div class="form-group" style="margin-bottom:15px;"><label>السبب / البيان</label><input type="text" id="cn-reason" placeholder="مثال: خصم تجاري..." required></div>
                    <div style="background:#f0fdfa; padding:15px; border-radius:8px; display:flex; justify-content:space-between;">
                        <strong>الإجمالي (شامل الضريبة 15%):</strong><strong id="cn-total" style="font-family:monospace; color:#0d9488; font-size:18px;">0.00</strong>
                    </div>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-success">حفظ وتوليد القيد</button></div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => { renderCNs(); });
        function renderCNs() {
            const tbody = document.getElementById('cn-body');
            const cns = getCreditNotes().reverse();
            if (cns.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">لا توجد إشعارات دائنة.</td></tr>'; return; }
            tbody.innerHTML = cns.map(c => `<tr>
                <td style="font-family:monospace; font-weight:700; color:#0d9488;">${c.cnNumber}</td>
                <td>${c.date}</td><td>${c.customerName}</td><td>${c.invoiceNumber}</td>
                <td style="font-family:monospace; font-weight:700; color:#ef4444;">${parseFloat(c.total).toFixed(2)}</td>
                <td>${c.reason}</td>
            </tr>`).join('');
        }
        function openCNModal() {
            document.getElementById('cn-modal').style.display = 'flex';
            document.getElementById('cn-date').valueAsDate = new Date();
            const sel = document.getElementById('cn-invoice');
            sel.innerHTML = '<option value="">-- اختر الفاتورة --</option>';
            getInvoices().forEach(i => { sel.innerHTML += `<option value="${i.id}" data-cust="${i.customerId}" data-custname="${i.customerName}" data-inv="${i.invoiceNumber}">${i.invoiceNumber} - ${i.customerName} (${i.total})</option>`; });
        }
        function calcCNTotal() {
            const amount = parseFloat(document.getElementById('cn-amount').value) || 0;
            const total = amount * 1.15;
            document.getElementById('cn-total').textContent = total.toFixed(2);
            return total;
        }
        function saveCN(e) {
            e.preventDefault();
            const invSel = document.getElementById('cn-invoice');
            if (!invSel.value) return alert('اختر الفاتورة');
            const invId = parseInt(invSel.value);
            const custId = parseInt(invSel.options[invSel.selectedIndex].getAttribute('data-cust'));
            const custName = invSel.options[invSel.selectedIndex].getAttribute('data-custname');
            const invNum = invSel.options[invSel.selectedIndex].getAttribute('data-inv');
            const amount = parseFloat(document.getElementById('cn-amount').value) || 0;
            const total = amount * 1.15;
            const vat = total - amount;
            const date = document.getElementById('cn-date').value;
            const reason = document.getElementById('cn-reason').value;
            if (amount <= 0) return alert('أدخل مبلغا صحيحا');
            const entries = getEntries();
            const entryNum = `CN-${new Date().getFullYear()}-${String(entries.length + 1).padStart(4, '0')}`;
            entries.push({
                id: Date.now(), entryNumber: entryNum, date: date,
                description: `إشعار دائن ${reason} - فاتورة ${invNum} - ${custName}`,
                lines: [
                    { accountCode: "4102", accountName: "مردودات المبيعات", debit: amount, credit: 0 },
                    { accountCode: "2102", accountName: "ضريبة المخرجات", debit: vat, credit: 0 },
                    { accountCode: "1103", accountName: "العملاء", debit: 0, credit: total }
                ],
                totalDebit: total, totalCredit: total, status: 'posted'
            });
            saveEntries(entries);
            updateCustomerBalance(custId, -total);
            const cns = getCreditNotes();
            const cnNum = `CN-${new Date().getFullYear()}-${String(cns.length + 1).padStart(4, '0')}`;
            cns.push({ id: Date.now(), cnNumber: cnNum, date, customerId: custId, customerName: custName, invoiceId: invId, invoiceNumber: invNum, amount, vat, total, reason, entryNumber: entryNum });
            saveCreditNotes(cns);
            document.getElementById('cn-modal').style.display = 'none';
            renderCNs();
            alert(`✅ تم إصدار الإشعار الدائن ${cnNum}`);
        }
    </script>

</html>
