<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | القيود المتكررة</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile">
                <span>OMRAN AQLAN</span>
                <div class="avatar"></div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="بحث في النظام المحاسبي...">
            </div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>القيود المتكررة (Recurring Entries)</h2>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openRecurringModal()">+ إنشاء قالب قيد جديد</button>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th width="30%">البيان (الشرح)</th>
                            <th width="20%">الحساب المدين</th>
                            <th width="20%">الحساب الدائن</th>
                            <th width="15%">المبلغ</th>
                            <th width="15%">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="recurring-body">
                        <!-- سيتم تعبئتها بالجافاسكريبت -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- نافذة إنشاء قالب -->
    <div class="modal-overlay" id="recurring-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إنشاء قالب قيد متكرر</h3>
                <button class="close-btn" onclick="closeRecurringModal()">×</button>
            </div>
            <form id="recurring-form" onsubmit="saveRecurringTemplate(event)">
                <div class="modal-body">
                    <div class="form-group full-width">
                        <label>البيان (الشرح)</label>
                        <input type="text" id="rec-desc" required placeholder="مثال: إيجار المكتب الشهري...">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>الحساب المدين (Dr)</label>
                            <select id="rec-debit" required></select>
                        </div>
                        <div class="form-group">
                            <label>الحساب الدائن (Cr)</label>
                            <select id="rec-credit" required></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>المبلغ</label>
                        <input type="number" id="rec-amount" value="0.00" step="0.01" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeRecurringModal()">إلغاء</button>
                    <button type="submit" class="btn btn-success">حفظ القالب</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/assets/js/recurring-entries.js?v=333444"></script>
    <!-- ===== Core Scripts (Cleaned by System) ===== -->
    <!-- ===== Core Scripts (Cleaned by System) ===== -->

    <!-- ===== Core Scripts (Injected by Audit System) ===== -->
    <script src="/assets/js/database.js?v=333444"></script>
    <script src="/assets/js/layout.js?v=333444"></script>
    <script src="/assets/js/app.js?v=333444"></script>
    <script src="/assets/js/company-info.js?v=333444"></script>
    <script src="/assets/js/permissions.js?v=333444"></script>
    <script src="/assets/js/ai-assistant.js?v=333444"></script>
    <script src="/assets/js/global-search.js?v=333444"></script>
    <script src="/assets/js/export-dark.js?v=333444"></script>

</body>
</html>
