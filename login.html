<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول | AL SHAMEL</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=555555">
    <link rel="stylesheet" href="/assets/css/components.css?v=555555">
    <style>
        body {
            display: flex; justify-content: center; align-items: center; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); margin: 0; font-family: 'Noto Naskh Arabic', 'Cairo', sans-serif;
        }
        .login-card {
            background: white; padding: 45px 40px; border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center;
            animation: slideDown 0.6s ease-out; position: relative;
        }
        @keyframes slideDown { from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .login-logo {
            width: 85px; height: 85px; background: linear-gradient(135deg, #10b981, #059669);
            color: white; border-radius: 22px; display: flex; justify-content: center; align-items: center;
            font-size: 42px; font-weight: 900; margin: 0 auto 20px auto;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }
        .login-card h2 { color: #0f172a; margin-bottom: 8px; font-size: 30px; font-weight: 900; letter-spacing: 1px; }
        .login-card p { color: #64748b; margin-bottom: 35px; font-size: 14px; font-weight: 600; }
        
        .form-group { text-align: right; margin-bottom: 22px; }
        .form-group label { font-weight: 800; font-size: 14px; color: #1e293b; margin-bottom: 8px; display: block; }
        
        /* تصميم مخصص لمنع المربع الأزرق المزعج */
        .login-card select, .login-card input {
            width: 100%; padding: 14px 15px; border: 2px solid #e2e8f0;
            border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; outline: none; background: #f8fafc;
            transition: all 0.3s; color: #0f172a; box-sizing: border-box;
        }
        
        .login-card select {
            appearance: none; /* إخفاء سهم المتصفح الافتراضي */
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 15px center;
            background-size: 18px;
            padding-left: 45px;
            cursor: pointer;
        }

        .login-card select:focus, .login-card input:focus { 
            border-color: #10b981; background: white; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); 
        }
        
        .login-card button {
            width: 100%; padding: 16px; background: #10b981; color: white;
            border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; 
            transition: all 0.3s; margin-top: 15px; font-family: inherit;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .login-card button:hover { background: #059669; box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }
        
        .error-msg { color: #ef4444; font-size: 13px; font-weight: bold; margin-top: 15px; display: none; background: #fee2e2; padding: 10px; border-radius: 8px; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">S</div>
        <h2>AL SHAMEL</h2>
        <p>Integrated Accounting & ERP System</p>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>المستخدم</label>
                <select id="login-user" required>
                    <!-- نضع مستخدم المدير كاحتياطي أساسي هنا -->
                    <option value="admin">OMRAN AQLAN (مدير النظام)</option>
                </select>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="login-pass" placeholder="******" required>
            </div>
            <button type="submit">تسجيل الدخول إلى النظام</button>
            <div id="error-message" class="error-msg"></div>
        </form>
    </div>

    <script src="/assets/js/database.js?v=777777"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('onyx_current_user'); // مسح الجلسة القديمة
            
            const select = document.getElementById('login-user');
            try {
                const users = getUsers();
                if (users && users.length > 0) {
                    // تفريغ القائمة وإضافة المستخدمين من قاعدة البيانات
                    select.innerHTML = '';
                    users.forEach(u => {
                        select.innerHTML += `<option value="${u.username}">${u.fullName} (${u.role})</option>`;
                    });
                }
            } catch(e) {
                console.warn('تم استخدام المدير الافتراضي.');
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const errorDiv = document.getElementById('error-message');

            // التحقق الذكي: إذا كان admin نسمح بكلمة المرور 123456 دائما
            if (username === 'admin' && pass === '123456') {
                const adminUser = { id: 1, username: "admin", fullName: "OMRAN AQLAN", role: "admin" };
                localStorage.setItem('onyx_current_user', JSON.stringify(adminUser));
                window.location.href = '/index.html';
                return;
            }

            // التحقق لباقي المستخدمين
            try {
                const user = getUsers().find(u => u.username === username);
                if (user && user.password === pass) {
                    localStorage.setItem('onyx_current_user', JSON.stringify(user));
                    window.location.href = '/index.html';
                } else {
                    showError(errorDiv);
                }
            } catch(err) {
                showError(errorDiv);
            }
        }

        function showError(el) {
            el.style.display = 'block';
            el.textContent = 'كلمة المرور أو اسم المستخدم غير صحيح!';
        }
    </script>
</body>
</html>
