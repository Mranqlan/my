<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قائمة التدفقات النقدية</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=555555">
    <link rel="stylesheet" href="/assets/css/components.css?v=555555">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header">
            <div class="user-profile">
                <span>OMRAN AQLAN</span>
                <div class="avatar"></div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="بحث في النظام المحاسبي...">
            </div>
        </header>
        <section class="content-area">
            <div class="page-header">
                <h2>قائمة التدفقات النقدية (Cash Flow Statement)</h2>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="window.print()">🖨️ طباعة التقرير</button>
                    <button class="btn btn-primary" onclick="generateCashFlow()">تحديث البيانات 🔄</button>
                </div>
            </div>
            <div class="report-container" style="max-width: 900px; margin: 0 auto;">
                <div class="report-header">
                    <h1><span class="dynamic-company-name">شركة AL SHAMEL للمحاسبة</span></h1>
                    <h3>قائمة التدفقات النقدية</h3>
                    <p>للفترة المنتهية في: <span id="report-date"></span></p>
                </div>
                <table class="report-table">
                    <tbody>
                        <!-- المقبوضات النقدية -->
                        <tr class="report-section-title">
                            <td colspan="2" style="color: #10b981;">التدفقات النقدية الداخلة (المقبوضات)</td>
                        </tr>
                        <tbody id="inflow-rows"></tbody>
                        <tr class="report-total-row">
                            <td>إجمالي المقبوضات النقدية</td>
                            <td id="total-inflow" class="text-success">0.00</td>
                        </tr>
                        <!-- المدفوعات النقدية -->
                        <tr class="report-section-title" style="margin-top: 20px;">
                            <td colspan="2" style="color: #ef4444;">التدفقات النقدية الخارجة (المدفوعات)</td>
                        </tr>
                        <tbody id="outflow-rows"></tbody>
                        <tr class="report-total-row">
                            <td>إجمالي المدفوعات النقدية</td>
                            <td id="total-outflow" class="text-danger">0.00</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <!-- صافي التدفق -->
                        <tr class="report-net-income" id="net-cash-row">
                            <td>صافي الزيادة (النقص) في النقدية</td>
                            <td id="net-cash-value">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>
    <script src="/assets/js/cash-flow.js?v=777777"></script>

    <script src="/assets/js/company-info.js?v=777777"></script>
    <script src="/assets/js/permissions.js?v=777777"></script>
    <script src="/assets/js/ai-assistant.js?v=777777"></script>
    <script src="/assets/js/global-search.js?v=777777"></script>
    <script src="/assets/js/export-dark.js?v=777777"></script>

</body>
</html>
