<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعز سوفت | تقرير أعمار الديون - العملاء</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=333333">
    <link rel="stylesheet" href="/assets/css/components.css?v=333333">
    <style>
        @media print {
            .sidebar, .top-header, .page-header .btn, .filter-bar, .no-print { display: none !important; }
            body, .main-wrapper, .content-area { margin: 0 !important; padding: 0 !important; width: 100% !important; background: white !important; height: auto !important; overflow: visible !important; }
            .table-container { box-shadow: none !important; border: none !important; padding: 0 !important; }
            .data-table th, .data-table td { border: 1px solid #000 !important; padding: 10px !important; color: #000 !important; }
            .data-table th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; }
            .text-success { color: #000 !important; font-weight: bold; }
            .text-danger { color: #000 !important; font-weight: bold; }
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<body>
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-wrapper">
        <header class="top-header no-print">
            <div class="user-profile"><span>OMRAN AQLAN</span><div class="avatar"></div></div>
        </header>
        <section class="content-area">
            <div class="page-header no-print">
                <h2>تقرير أعمار الديون - العملاء (Aging Report)</h2>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="window.print()">🖨️ طباعة التقرير</button>
                    <button class="btn btn-primary" onclick="generateAgingReport()">تحديث البيانات 🔄</button>
                </div>
            </div>
            <div id="print-area" class="table-container">
                <div class="report-header" style="text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px;">
                    <h1 style="color: #1e293b; margin: 0; font-size: 28px;"><span class="dynamic-company-name">شركة تعز سوفت للمحاسبة</span></h1>
                    <h3 style="color: #64748b; margin: 5px 0;">تقرير أعمار الديون (محدث بالدفعات)</h3>
                    <p style="margin-top: 10px; font-weight: 700;">كما في تاريخ: <span id="report-date"></span></p>
                </div>
                <table class="data-table trial-balance-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th width="20%">اسم العميل</th>
                            <th width="16%" style="color: #10b981;">0 - 30 يوم</th>
                            <th width="16%" style="color: #3b82f6;">31 - 60 يوم</th>
                            <th width="16%" style="color: #f59e0b;">61 - 90 يوم</th>
                            <th width="16%" style="color: #ef4444;">أكثر من 90 يوم</th>
                            <th width="16%">الإجمالي المستحق</th>
                        </tr>
                    </thead>
                    <tbody id="aging-body"></tbody>
                    <tfoot>
                        <tr class="totals-row" style="background-color: #e2e8f0; font-weight: bold;">
                            <td>الإجماليات</td>
                            <td id="total-0-30">0.00</td>
                            <td id="total-31-60">0.00</td>
                            <td id="total-61-90">0.00</td>
                            <td id="total-90-plus">0.00</td>
                            <td id="total-overall">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            document.getElementById('report-date').textContent = today.toLocaleDateString('ar-EG');
            generateAgingReport();
        });
        function generateAgingReport() {
            const customers = getCustomers();
            const invoices = getInvoices();
            const returns = getSalesReturns();
            const today = new Date();
            let agingData = {};
            customers.forEach(cust => {
                let currentBalance = parseFloat(cust.balance) || 0;
                if (currentBalance <= 0) return; // لا يوجد دين
                // جلب فواتير هذا العميل وخصم المرتجعات منها
                let custInvoices = invoices.filter(inv => inv.customerId === cust.id).map(inv => {
                    let invReturns = returns ? returns.filter(r => r.invoiceId === inv.id).reduce((sum, r) => sum + r.total, 0) : 0;
                    return {
                        date: inv.date,
                        netAmount: inv.total - invReturns
                    };
                }).filter(inv => inv.netAmount > 0);
                // ترتيب الفواتير من الأقدم للأحدث (FIFO)
                custInvoices.sort((a, b) => new Date(a.date) - new Date(b.date));
                let totalInvoiceAmount = custInvoices.reduce((sum, inv) => sum + inv.netAmount, 0);
                let remainingBalance = currentBalance;
                let buckets = { current: 0, d30: 0, d60: 0, d90: 0 };
                // 1. معالجة الرصيد الافتتاحي (إذا كان الرصيد أكبر من مجموع الفواتير)
                // هذا يعني أن هناك ديونا قديمة غير مسجلة كفواتير (رصيد افتتاحي)
                if (remainingBalance > totalInvoiceAmount) {
                    let openingBalance = remainingBalance - totalInvoiceAmount;
                    buckets.d90 += openingBalance; // نعتبرها ديون قديمة جدا
                    remainingBalance = totalInvoiceAmount; 
                }
                // 2. توزيع الرصيد المتبقي على الفواتير (من الأقدم للأحدث)
                // المبلغ المدفوع = إجمالي الفواتير - الرصيد الحالي
                let totalPayments = totalInvoiceAmount - remainingBalance;
                custInvoices.forEach(inv => {
                    let unpaidAmount = inv.netAmount;
                    // خصم الدفعات من الفاتورة الأقدم أولا
                    if (totalPayments > 0) {
                        if (totalPayments >= unpaidAmount) {
                            totalPayments -= unpaidAmount;
                            unpaidAmount = 0; // تم سداد هذه الفاتورة بالكامل
                        } else {
                            unpaidAmount -= totalPayments;
                            totalPayments = 0; // تم استهلاك الدفعة بالكامل
                        }
                    }
                    if (unpaidAmount > 0) {
                        let diffTime = Math.abs(today - new Date(inv.date));
                        let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays <= 30) buckets.current += unpaidAmount;
                        else if (diffDays <= 60) buckets.d30 += unpaidAmount;
                        else if (diffDays <= 90) buckets.d60 += unpaidAmount;
                        else buckets.d90 += unpaidAmount;
                    }
                });
                let total = buckets.current + buckets.d30 + buckets.d60 + buckets.d90;
                if (total > 0.01) {
                    agingData[cust.name] = { ...buckets, total };
                }
            });
            renderAgingTable(agingData);
        }
        function renderAgingTable(data) {
            const tbody = document.getElementById('aging-body');
            tbody.innerHTML = '';
            let grandTotals = { current: 0, d30: 0, d60: 0, d90: 0, total: 0 };
            let hasData = false;
            for (const [customerName, amounts] of Object.entries(data)) {
                hasData = true;
                grandTotals.current += amounts.current; grandTotals.d30 += amounts.d30; grandTotals.d60 += amounts.d60; grandTotals.d90 += amounts.d90; grandTotals.total += amounts.total;
                tbody.innerHTML += `
                    <tr>
                        <td style="text-align: right; font-weight: bold;">${customerName}</td>
                        <td class="text-success">${amounts.current > 0 ? amounts.current.toFixed(2) : '-'}</td>
                        <td style="color: #3b82f6; font-weight: bold;">${amounts.d30 > 0 ? amounts.d30.toFixed(2) : '-'}</td>
                        <td style="color: #f59e0b; font-weight: bold;">${amounts.d60 > 0 ? amounts.d60.toFixed(2) : '-'}</td>
                        <td class="text-danger">${amounts.d90 > 0 ? amounts.d90.toFixed(2) : '-'}</td>
                        <td style="font-weight: bold; background-color: #f8fafc;">${amounts.total.toFixed(2)}</td>
                    </tr>
                `;
            }
            if (!hasData) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748b; padding: 30px;">لا توجد ديون مستحقة على العملاء.</td></tr>';
            }
            document.getElementById('total-0-30').textContent = grandTotals.current.toFixed(2);
            document.getElementById('total-31-60').textContent = grandTotals.d30.toFixed(2);
            document.getElementById('total-61-90').textContent = grandTotals.d60.toFixed(2);
            document.getElementById('total-90-plus').textContent = grandTotals.d90.toFixed(2);
            document.getElementById('total-overall').textContent = grandTotals.total.toFixed(2);
        }
    </script>
